<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="description" content="Tokyo 2027 個人馬拉松訓練追蹤工具" />
  <title>Tokyo 2027 Training</title>

  <!--
    V1.3.5.1：互動訓練紀錄 + RPE + Tokyo Journey
    1) Today：今天該做什麼
    2) Training Calendar：整體課表與完成狀態
    3) Daily Workout：RUN / CLASS / STRENGTH / GYM / RECOVERY
    4) Today 狀態：READY / TIRED / SORE
    5) 完成後記錄 RPE / 腿部狀態
    6) 週 / 月統計、Tokyo Journey、分享卡

    Race 與 Course 先保留入口，之後再加。
  -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">MARATHON TRAINING</p>
        <h1>TOKYO 2027</h1>
      </div>
      <button id="resetBtn" class="ghost-button" type="button" title="清除本機完成紀錄">Reset</button>
    </header>

    <main id="app" class="page-content" aria-live="polite">
      <!-- JavaScript 會把頁面內容放到這裡 -->
    </main>

    <nav class="bottom-nav" aria-label="主要導覽">
      <button class="nav-item active" data-view="today" type="button">
        <span class="nav-icon">●</span>
        <span>Today</span>
      </button>
      <button class="nav-item" data-view="calendar" type="button">
        <span class="nav-icon">▦</span>
        <span>Training</span>
      </button>
      <button class="nav-item disabled" type="button" disabled>
        <span class="nav-icon">◇</span>
        <span>Race</span>
        <small>Later</small>
      </button>
      <button class="nav-item disabled" type="button" disabled>
        <span class="nav-icon">⌁</span>
        <span>Course</span>
        <small>Later</small>
      </button>
    </nav>
  </div>

  <!-- 單日課表彈出視窗 -->
  <dialog id="workoutDialog" class="workout-dialog">
    <div id="workoutDialogContent"></div>
  </dialog>

  <!-- V1.3.5.1：週 / 月訓練分享卡預覽 -->
  <dialog id="shareDialog" class="share-dialog">
    <div class="share-dialog-inner">
      <div class="share-dialog-head">
        <div>
          <p class="eyebrow">TRAINING RECORD</p>
          <h2>分享卡預覽</h2>
        </div>
        <button id="closeShareDialog" class="dialog-close" type="button">×</button>
      </div>
      <img id="sharePreview" class="share-preview" alt="Tokyo 2027 訓練分享卡預覽" />
      <div class="share-actions">
        <button id="nativeShareBtn" class="primary-button" type="button">分享 / 儲存圖片</button>
        <button id="downloadShareBtn" class="secondary-button" type="button">下載 PNG</button>
      </div>
      <p id="shareHint" class="notice">手機支援時會開啟系統分享選單；桌機可直接下載 PNG。</p>
    </div>
  </dialog>

  <script src="js/storage.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
